<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GreenWave Music</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#080b09;--panel:#121714;--panel2:#1b231e;--green:#1ed760;--text:#f5f7f5;--muted:#a7b1aa;--line:#2a342d;--danger:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{border:0;border-radius:999px;padding:10px 16px;background:var(--green);color:#061108;font-weight:750;cursor:pointer}button:hover{filter:brightness(1.08)}button:disabled{opacity:.5;cursor:wait}.secondary{background:#29332c;color:var(--text)}.danger{background:#472323;color:#ffdada}.small{padding:6px 10px;font-size:.85rem}input,textarea,select{width:100%;padding:11px 12px;border:1px solid #39453d;border-radius:9px;background:#0b100d;color:var(--text);margin:5px 0 12px}textarea{min-height:76px;resize:vertical}label{font-size:.9rem;color:#cbd4cd;display:block}.muted{color:var(--muted);font-size:.9rem}.hidden{display:none!important}.app{min-height:100vh;padding:12px 12px 110px;display:grid;grid-template-columns:255px minmax(0,1fr);gap:12px}.sidebar,.main{background:var(--panel);border-radius:12px;min-width:0}.sidebar{padding:18px;display:flex;flex-direction:column;gap:12px}.brand{font-weight:900;font-size:1.3rem;letter-spacing:-.5px;margin:4px 0 16px}.brand span{color:var(--green)}.navbtn{background:transparent;color:#c8d0ca;text-align:left;border-radius:8px;width:100%;padding:10px}.navbtn.active,.navbtn:hover{background:#263229;color:white}.main{padding:22px;overflow:hidden}.top{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:18px}.top input{max-width:460px;margin:0}.userline{font-size:.88rem;color:var(--muted);white-space:nowrap}.hero{background:linear-gradient(115deg,#183c25,#111b14 70%);padding:25px;border-radius:12px;margin-bottom:24px}.hero h1{font-size:clamp(1.7rem,4vw,2.6rem);margin:0 0 8px}.hero p{margin:0;color:#d1e3d5}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 12px}.sectionhead h2{font-size:1.25rem;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}.card{padding:12px;border-radius:10px;background:#171e19;min-width:0;cursor:pointer}.card:hover{background:#222c25}.cover{width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px;background:#25372a}.card h3{font-size:.98rem;margin:10px 0 3px;overflow-wrap:anywhere}.card p{font-size:.85rem;color:var(--muted);margin:0;overflow-wrap:anywhere}.songlist{display:flex;flex-direction:column;gap:5px}.songrow{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:12px;padding:8px;border-radius:8px}.songrow:hover{background:#222b24}.songrow img{width:42px;height:42px;object-fit:cover;border-radius:5px;background:#29382d}.songtitle{font-weight:650;overflow-wrap:anywhere}.songmeta{font-size:.82rem;color:var(--muted)}.songactions{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end}.songactions button{font-size:.8rem;padding:7px 10px}.pill{display:inline-block;border:1px solid #465348;border-radius:999px;padding:2px 8px;font-size:.75rem;color:#d4ded6}.pill.private{color:#ffd99a;border-color:#6b5631}.modalback{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;overflow:auto}.modal{background:#151c17;border:1px solid var(--line);border-radius:14px;padding:22px;width:min(620px,100%);max-height:92vh;overflow:auto}.modal h2{margin-top:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid .full{grid-column:1/-1}.notice{padding:11px 13px;border-radius:8px;background:#1a2b1e;color:#d8f6df;white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0}.notice.error{background:#351d1d;color:#ffd4d4}.empty{padding:30px 10px;text-align:center;color:var(--muted)}.player{position:fixed;z-index:5;bottom:0;left:0;right:0;min-height:86px;background:#111713;border-top:1px solid #2b352e;display:grid;grid-template-columns:minmax(130px,1fr) minmax(220px,1.5fr) minmax(100px,1fr);gap:18px;align-items:center;padding:12px 22px}.now{display:flex;align-items:center;gap:10px;min-width:0}.now img{width:52px;height:52px;object-fit:cover;border-radius:6px;background:#26382b}.nowtxt{min-width:0}.nowtxt strong,.nowtxt span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nowtxt span{font-size:.8rem;color:var(--muted)}.controls{text-align:center}.controlbuttons{display:flex;align-items:center;justify-content:center;gap:12px}.controlbuttons button{padding:6px 10px}.playmain{width:38px;height:38px;padding:0;font-size:1.05rem}.progress{display:flex;align-items:center;gap:9px;font-size:.75rem;color:var(--muted)}input[type=range]{padding:0;margin:8px 0;accent-color:var(--green)}.volume{display:flex;align-items:center;gap:8px;justify-content:flex-end}.loginwrap{min-height:100vh;display:grid;place-items:center;padding:18px}.loginbox{width:min(410px,100%);background:var(--panel);padding:28px;border-radius:16px;border:1px solid var(--line)}.loginbox h1{margin:0 0 8px}.loginbox .brand{margin-top:0}.checkline{display:flex;gap:8px;align-items:center}.checkline input{width:auto;margin:0}.filehint{font-size:.8rem;color:var(--muted);margin-top:-6px;margin-bottom:10px}
@media(max-width:760px){.app{grid-template-columns:1fr;padding:8px 8px 145px}.sidebar{padding:10px;display:block}.brand{margin:4px 8px 8px}.sideactions{display:flex;gap:6px;flex-wrap:wrap}.navbtn{width:auto;padding:8px 10px}.sidebar .muted,.sidebar #userSummary{display:none}.main{padding:15px}.top{align-items:stretch;flex-direction:column}.top input{max-width:none}.player{grid-template-columns:1fr auto;gap:8px;padding:9px 12px}.now img{width:42px;height:42px}.controls{grid-column:1/-1;grid-row:2}.volume{display:none}.formgrid{grid-template-columns:1fr}.formgrid .full{grid-column:auto}.songrow{grid-template-columns:38px minmax(0,1fr);}.songactions{grid-column:2;justify-content:flex-start}.songrow img{width:38px;height:38px}}
</style>
</head>
<body>
<div id="loginView" class="loginwrap">
  <div class="loginbox">
    <div class="brand">● <span>GreenWave</span> Music</div>
    <h1>ログイン</h1><p class="muted">既存のChanProアカウントでログインします。</p>
    <p class="muted">接続先はプログラムに設定されています。</p>
    <label>ユーザー名<input id="loginName" autocomplete="username"></label>
    <label>パスワード<input id="loginPass" type="password" autocomplete="current-password"></label>
    <button id="loginBtn" style="width:100%;margin-top:8px">ログイン</button>
    <div id="loginMsg" class="notice hidden"></div>
    <p class="muted">※このページは既存usersテーブルのSHA-256方式を使います。新規アカウント作成はChanPro側で行ってください。</p>
  </div>
</div>
<div id="appView" class="app hidden">
  <aside class="sidebar">
    <div class="brand">● <span>GreenWave</span> Music</div>
    <div class="sideactions">
      <button class="navbtn active" data-view="home">⌂ ホーム</button>
      <button class="navbtn" data-view="library">♫ 曲ライブラリ</button>
      <button class="navbtn" data-view="playlists">▤ プレイリスト</button>
    </div>
    <button id="addSongBtn">＋ 音楽をアップロード</button>
    <button id="newPlaylistBtn" class="secondary">＋ プレイリストを作成</button>
    <div class="muted">ログイン中</div><div id="userSummary"></div>
    <button id="logoutBtn" class="secondary">ログアウト</button>
  </aside>
  <main class="main">
    <div class="top"><input id="search" placeholder="曲名、アーティスト、プレイリストを検索…"><div class="userline" id="topUser"></div></div>
    <div id="notice" class="notice hidden" role="status"></div>
    <div id="content"></div>
  </main>
</div>
<div id="playerBar" class="player hidden">
  <div class="now"><img id="nowCover" alt=""><div class="nowtxt"><strong id="nowTitle">曲を選択してください</strong><span id="nowArtist">—</span></div></div>
  <div class="controls"><div class="controlbuttons"><button id="shuffleBtn" class="secondary small" title="シャッフル">🔀</button><button id="prevBtn" class="secondary small">◀|</button><button id="playBtn" class="playmain" title="再生">▶</button><button id="nextBtn" class="secondary small">|▶</button><button id="repeatBtn" class="secondary small" title="リピート">↻</button></div><div class="progress"><span id="currentTime">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="duration">0:00</span></div></div>
  <div class="volume"><span>🔊</span><input id="volume" type="range" min="0" max="1" step=".01" value=".8" style="max-width:120px"></div>
</div>
<audio id="audioEl" preload="metadata"></audio>
<div id="modalBack" class="modalback hidden"><div class="modal"><div id="modalContent"></div></div></div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const SUPABASE_URL="https://ldnmqfmebvyzlmhgnljf.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_sJCCy8PpxucgNgweKh9jsA_BKne3v3U";
const IMGBB_API_KEY="e27c0f0bd8ccfa14ec02017f09d38d09";
const MAX_AUDIO_SIZE=15*1024*1024; // 15 MiB：PNG化後の容量増加を考慮
let db=null,currentUser=null,imgKey=IMGBB_API_KEY,songs=[],playlists=[],playlistItems=[],activeView="home",activePlaylist=null,queue=[],queueIndex=-1,currentSong=null,shuffle=false,repeat=false,playerObjectUrl=null;
const audio=$("audioEl"),DEFAULT_COVER="data:image/svg+xml;charset=UTF-8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><rect width="300" height="300" fill="#183b25"/><circle cx="150" cy="150" r="84" fill="#1ed760"/><path d="M125 98v104l82-52z" fill="#082010"/></svg>');
function msg(text,error=false){const el=$("notice");el.textContent=text;el.classList.remove("hidden","error");if(error)el.classList.add("error")}
function clearMsg(){$("notice").classList.add("hidden")}
function loginMsg(text,error=true){const el=$("loginMsg");el.textContent=text;el.classList.remove("hidden","error");if(error)el.classList.add("error")}
function fmt(n){if(!Number.isFinite(n)||n<0)return"0:00";return Math.floor(n/60)+":"+String(Math.floor(n%60)).padStart(2,"0")}
function safeCover(url){return typeof url==="string"&&/^https?:\/\//i.test(url)?url:DEFAULT_COVER}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function hashPassword(value){const bytes=new TextEncoder().encode(value);const digest=await crypto.subtle.digest("SHA-256",bytes);return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,"0")).join("")}
async function login(){const url=SUPABASE_URL,key=SUPABASE_ANON_KEY,name=$("loginName").value.trim(),pass=$("loginPass").value;if(!name||!pass)return loginMsg("ユーザー名とパスワードを入力してください。");$("loginBtn").disabled=true;loginMsg("ログインしています…",false);try{db=window.supabase.createClient(url,key);const hash=await hashPassword(pass);const {data,error}=await db.from("users").select("id,username,password_hash,ban_until").eq("username",name).maybeSingle();if(error)throw error;if(!data||data.password_hash!==hash)throw new Error("ユーザー名またはパスワードが違います。");if(data.ban_until&&new Date(data.ban_until)>new Date())throw new Error("このアカウントは一時的に利用できません。");currentUser={id:data.id,username:data.username};$("loginView").classList.add("hidden");$("appView").classList.remove("hidden");$("playerBar").classList.remove("hidden");$("userSummary").textContent=data.username;$("topUser").textContent=data.username+" さん";await loadAll();render()}catch(e){console.error(e);loginMsg("ログインできませんでした: "+(e.message||"接続エラー")+"。Supabaseのテーブル権限も確認してください。")}finally{$("loginBtn").disabled=false}}
async function loadAll(){const [s,p,pi]=await Promise.all([db.from("music_tracks").select("*").order("created_at",{ascending:false}),db.from("music_playlists").select("*").eq("user_id",currentUser.id).order("created_at",{ascending:false}),db.from("music_playlist_tracks").select("*").order("position",{ascending:true})]);if(s.error)throw s.error;if(p.error)throw p.error;if(pi.error)throw pi.error;songs=s.data||[];playlists=p.data||[];playlistItems=pi.data||[]}
function visibleSongs(){return songs.filter(s=>s.is_public||s.user_id===currentUser.id)}
function matches(text,q){return String(text||"").toLowerCase().includes(q.toLowerCase())}
function songCard(s){return `<div class="card" data-play="${s.id}"><img class="cover" src="${escapeHtml(s.cover_url||DEFAULT_COVER)}" onerror="this.onerror=null;this.src=DEFAULT_COVER" alt=""><h3>${escapeHtml(s.title)}</h3><p>${escapeHtml(s.artist||"アーティスト不明")}</p><p style="margin-top:7px"><span class="pill ${s.is_public?"":"private"}">${s.is_public?"公開":"非公開"}</span></p></div>`}
function songRow(s,idx){const own=s.user_id===currentUser.id;return `<div class="songrow"><img src="${escapeHtml(s.cover_url||DEFAULT_COVER)}" onerror="this.onerror=null;this.src=DEFAULT_COVER" alt=""><div style="min-width:0"><div class="songtitle">${escapeHtml(s.title)}</div><div class="songmeta">${escapeHtml(s.artist||"アーティスト不明")} · <span class="pill ${s.is_public?"":"private"}">${s.is_public?"公開":"非公開"}</span></div></div><div class="songactions"><button class="small" data-play="${s.id}">▶ 再生</button>${own?`<button class="small secondary" data-edit="${s.id}">編集</button><button class="small secondary" data-privacy="${s.id}">${s.is_public?"非公開に":"公開に"}</button><button class="small danger" data-delete="${s.id}">削除</button>`:""}<button class="small secondary" data-addtoplaylist="${s.id}">＋リスト</button></div></div>`}
function playlistCard(p){const count=playlistItems.filter(i=>i.playlist_id===p.id).length;return `<div class="card" data-openplaylist="${p.id}"><img class="cover" src="${escapeHtml(p.cover_url||DEFAULT_COVER)}" onerror="this.onerror=null;this.src=DEFAULT_COVER" alt=""><h3>${escapeHtml(p.name)}</h3><p>${count} 曲</p></div>`}
function render(){const root=$("content"),q=$("search").value.trim();const all=visibleSongs().filter(s=>!q||matches(s.title,q)||matches(s.artist,q)||matches(s.description,q));let html="";
if(activeView==="home"){html=`<div class="hero"><h1>音楽を楽しもう。</h1><p>お気に入りの曲を集めて、自分だけのプレイリストを作成。</p><div style="margin-top:18px"><button data-action="upload">＋ 音楽を追加</button> <button class="secondary" data-action="playlist">プレイリストを作成</button></div></div><div class="sectionhead"><h2>最近追加された曲</h2><button class="secondary small" data-view="library">すべて見る</button></div><div class="grid">${all.slice(0,8).map(songCard).join("")||'<div class="empty">まだ曲がありません。音楽をアップロードして始めましょう。</div>'}</div><div class="sectionhead"><h2>あなたのプレイリスト</h2><button class="secondary small" data-view="playlists">すべて見る</button></div><div class="grid">${playlists.slice(0,8).map(playlistCard).join("")||'<div class="empty">プレイリストはまだありません。</div>'}</div>`}
else if(activeView==="library"){html=`<div class="sectionhead"><h2>曲ライブラリ</h2><button data-action="upload">＋ 音楽をアップロード</button></div><p class="muted">公開曲と、自分がアップロードした非公開曲を表示します。</p><div class="songlist">${all.map(songRow).join("")||'<div class="empty">一致する曲がありません。</div>'}</div>`}
else if(activeView==="playlists"){const ps=playlists.filter(p=>!q||matches(p.name,q)||matches(p.description,q));html=`<div class="sectionhead"><h2>プレイリスト</h2><button data-action="playlist">＋ 作成</button></div><div class="grid">${ps.map(playlistCard).join("")||'<div class="empty">プレイリストがありません。</div>'}</div>`}
else if(activeView==="playlistDetail"){const p=playlists.find(x=>x.id===activePlaylist);if(!p){activeView="playlists";return render()}const items=playlistItems.filter(i=>i.playlist_id===p.id).sort((a,b)=>a.position-b.position);const ss=items.map(i=>songs.find(s=>s.id===i.track_id)).filter(s=>s&&(s.is_public||s.user_id===currentUser.id)).filter(s=>!q||matches(s.title,q)||matches(s.artist,q));html=`<div class="hero" style="display:flex;gap:18px;align-items:end"><img src="${escapeHtml(p.cover_url||DEFAULT_COVER)}" onerror="this.onerror=null;this.src=DEFAULT_COVER" style="width:150px;max-width:35%;aspect-ratio:1;object-fit:cover;border-radius:8px"><div><p>プレイリスト</p><h1>${escapeHtml(p.name)}</h1><p>${escapeHtml(p.description||"")} · ${ss.length} 曲</p><div style="margin-top:12px"><button data-action="editplaylist" data-id="${p.id}">編集</button> <button class="secondary" data-action="addsongs" data-id="${p.id}">曲を追加</button> <button class="danger" data-action="deleteplaylist" data-id="${p.id}">削除</button> <button class="secondary" data-view="playlists">戻る</button></div></div></div><div class="songlist">${ss.map((s)=>{const i=items.find(x=>x.track_id===s.id);return songRow(s)+`<div style="display:flex;gap:6px;justify-content:flex-end;margin:-3px 8px 8px"><button class="small secondary" data-moveup="${i.id}">↑ 上へ</button><button class="small secondary" data-movedown="${i.id}">↓ 下へ</button><button class="small danger" data-removefrom="${i.id}">リストから削除</button></div>`}).join("")||'<div class="empty">このプレイリストに曲がありません。</div>'}</div>`}
root.innerHTML=html;root.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>{activeView=b.dataset.view;activePlaylist=null;render()}));root.querySelectorAll("[data-play]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();const id=b.dataset.play;const list=visibleSongs().filter(s=>!q||matches(s.title,q)||matches(s.artist,q));startSong(id,list)}));root.querySelectorAll("[data-openplaylist]").forEach(b=>b.addEventListener("click",()=>{activePlaylist=b.dataset.openplaylist;activeView="playlistDetail";render()}));root.querySelectorAll("[data-action]").forEach(b=>b.addEventListener("click",()=>action(b.dataset.action,b.dataset.id)));root.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>openSongModal(songs.find(s=>s.id===b.dataset.edit))));root.querySelectorAll("[data-delete]").forEach(b=>b.addEventListener("click",()=>deleteSong(b.dataset.delete)));root.querySelectorAll("[data-privacy]").forEach(b=>b.addEventListener("click",()=>togglePrivacy(b.dataset.privacy)));root.querySelectorAll("[data-addtoplaylist]").forEach(b=>b.addEventListener("click",()=>choosePlaylist(b.dataset.addtoplaylist)));root.querySelectorAll("[data-removefrom]").forEach(b=>b.addEventListener("click",()=>removeFromPlaylist(b.dataset.removefrom)));root.querySelectorAll("[data-moveup]").forEach(b=>b.addEventListener("click",()=>moveTrack(b.dataset.moveup,-1)));root.querySelectorAll("[data-movedown]").forEach(b=>b.addEventListener("click",()=>moveTrack(b.dataset.movedown,1)))}
async function action(name,id){if(name==="upload")openSongModal();if(name==="playlist")openPlaylistModal();if(name==="editplaylist")openPlaylistModal(playlists.find(p=>p.id===id));if(name==="deleteplaylist")deletePlaylist(id);if(name==="addsongs")choosePlaylist(null,id)}
function openModal(content){$("modalContent").innerHTML=content;$("modalBack").classList.remove("hidden")}
function closeModal(){$("modalBack").classList.add("hidden");$("modalContent").innerHTML=""}
$("modalBack").addEventListener("click",e=>{if(e.target===$("modalBack"))closeModal()});
function openSongModal(song=null){const s=song||{};openModal(`<h2>${song?"曲の情報を編集":"音楽をアップロード"}</h2><form id="songForm"><label>音声ファイル ${song?"（変更する場合のみ選択）":"（必須）"}<input id="songFile" type="file" accept="audio/*,.mp3,.wav,.ogg,.m4a,.flac,.aac,.opus,.webm" ${song?"":"required"}></label><div class="filehint">WAV・MP3などに対応。音声ファイルは15MB以下にしてください。音声をPNGに変換してImgBBに保存します。</div><div class="formgrid"><div><label>曲名<input id="songTitle" required maxlength="180" value="${escapeHtml(s.title||"")}"></label></div><div><label>アーティスト名<input id="songArtist" maxlength="180" value="${escapeHtml(s.artist||"")}"></label></div><div class="full"><label>サムネイル画像URL（任意）<input id="coverUrl" type="url" placeholder="https://..." value="${escapeHtml(s.cover_url||"")}"></label></div><div class="full"><label>またはサムネイル画像をアップロード<input id="coverFile" type="file" accept="image/*"></label></div><div class="full"><label>説明<textarea id="songDescription" maxlength="2000">${escapeHtml(s.description||"")}</textarea></label></div><div class="full"><label class="checkline"><input id="songPublic" type="checkbox" ${s.is_public===false?"":"checked"}> 他のユーザーに公開する</label></div></div><div id="songModalMsg" class="notice hidden"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="secondary" id="cancelSong">キャンセル</button><button id="saveSong" type="submit">${song?"変更を保存":"アップロード"}</button></div></form>`);$("cancelSong").onclick=closeModal;$("songForm").onsubmit=async e=>{e.preventDefault();const btn=$("saveSong");btn.disabled=true;const say=t=>{const n=$("songModalMsg");n.textContent=t;n.classList.remove("hidden","error")};try{let audioUrl=s.audio_url||"",audioName=s.audio_name||"",mime=s.mime_type||"application/octet-stream",size=s.file_size||0;const file=$("songFile").files[0];if(file){say("音声をPNGに変換しています…");const png=await encodeAudioToPng(file);say("ImgBBへ音声PNGをアップロードしています…");audioUrl=await uploadImgBB(png,file.name+".png");audioName=file.name;mime=file.type||"application/octet-stream";size=file.size}if(!audioUrl)throw new Error("音声ファイルを選択してください。");let cover=$("coverUrl").value.trim()||s.cover_url||"";const coverFile=$("coverFile").files[0];if(coverFile){say("サムネイルをアップロードしています…");cover=await uploadImgBB(coverFile,coverFile.name)}if(cover&&!/^https?:\/\//i.test(cover))throw new Error("サムネイルURLはhttps://またはhttp://から入力してください。");const row={user_id:currentUser.id,title:$("songTitle").value.trim(),artist:$("songArtist").value.trim(),description:$("songDescription").value.trim(),audio_url:audioUrl,audio_name:audioName,mime_type:mime,file_size:size,cover_url:cover||null,is_public:$("songPublic").checked};say("データベースに保存しています…");let result;if(song)result=await db.from("music_tracks").update(row).eq("id",song.id).eq("user_id",currentUser.id);else result=await db.from("music_tracks").insert(row);if(result.error)throw result.error;await loadAll();closeModal();msg(song?"曲の情報を更新しました。":"音楽をアップロードしました。");render()}catch(err){console.error(err);const n=$("songModalMsg");n.textContent="エラー: "+(err.message||"処理に失敗しました");n.classList.remove("hidden");n.classList.add("error")}finally{btn.disabled=false}}}
function openPlaylistModal(p=null){openModal(`<h2>${p?"プレイリストを編集":"プレイリストを作成"}</h2><form id="playlistForm"><label>名前<input id="plName" required maxlength="120" value="${escapeHtml(p?.name||"")}"></label><label>説明<textarea id="plDescription" maxlength="1000">${escapeHtml(p?.description||"")}</textarea></label><label>カバー画像URL<input id="plCoverUrl" type="url" placeholder="https://..." value="${escapeHtml(p?.cover_url||"")}"></label><label>またはカバー画像をアップロード<input id="plCoverFile" type="file" accept="image/*"></label><div id="plMsg" class="notice hidden"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="secondary" id="cancelPl">キャンセル</button><button id="savePl">${p?"保存":"作成"}</button></div></form>`);$("cancelPl").onclick=closeModal;$("playlistForm").onsubmit=async e=>{e.preventDefault();$("savePl").disabled=true;try{let cover=$("plCoverUrl").value.trim()||p?.cover_url||"";const f=$("plCoverFile").files[0];if(f)cover=await uploadImgBB(f,f.name);if(cover&&!/^https?:\/\//i.test(cover))throw new Error("画像URLを確認してください。");const row={user_id:currentUser.id,name:$("plName").value.trim(),description:$("plDescription").value.trim(),cover_url:cover||null};const r=p?await db.from("music_playlists").update(row).eq("id",p.id).eq("user_id",currentUser.id):await db.from("music_playlists").insert(row);if(r.error)throw r.error;await loadAll();closeModal();activeView=p?activeView:"playlists";render();msg("プレイリストを保存しました。")}catch(err){const n=$("plMsg");n.textContent="エラー: "+err.message;n.classList.remove("hidden");n.classList.add("error")}finally{$("savePl").disabled=false}}}
async function deleteSong(id){const s=songs.find(x=>x.id===id);if(!s||s.user_id!==currentUser.id)return;if(!confirm("この曲をライブラリから削除しますか？プレイリストからも消えます。ImgBB上のファイルは別途削除が必要です。"))return;try{const r=await db.from("music_tracks").delete().eq("id",id).eq("user_id",currentUser.id);if(r.error)throw r.error;await loadAll();if(currentSong?.id===id)stopPlayer();render();msg("曲を削除しました。ImgBB上の画像ファイルはImgBB側で削除してください。")}catch(e){msg("削除エラー: "+e.message,true)}}
async function togglePrivacy(id){const s=songs.find(x=>x.id===id);if(!s||s.user_id!==currentUser.id)return;try{const r=await db.from("music_tracks").update({is_public:!s.is_public}).eq("id",id).eq("user_id",currentUser.id);if(r.error)throw r.error;await loadAll();render();msg(s.is_public?"曲を非公開にしました。":"曲を公開しました。")}catch(e){msg("設定変更エラー: "+e.message,true)}}
async function deletePlaylist(id){const p=playlists.find(x=>x.id===id);if(!p||p.user_id!==currentUser.id)return;if(!confirm("このプレイリストを削除しますか？曲ファイルは削除されません。"))return;try{const r=await db.from("music_playlists").delete().eq("id",id).eq("user_id",currentUser.id);if(r.error)throw r.error;await loadAll();activeView="playlists";activePlaylist=null;render();msg("プレイリストを削除しました。")}catch(e){msg("削除エラー: "+e.message,true)}}
function choosePlaylist(trackId=null,playlistId=null){if(!playlists.length){openPlaylistModal();msg("先にプレイリストを作成してください。");return}const opts=playlists.map(p=>`<option value="${p.id}" ${playlistId===p.id?"selected":""}>${escapeHtml(p.name)}</option>`).join("");const eligible=visibleSongs().filter(s=>!trackId||s.id===trackId);openModal(`<h2>${trackId?"曲をプレイリストに追加":"プレイリストに曲を追加"}</h2><form id="chooseForm"><label>プレイリスト<select id="choosePl">${opts}</select></label>${trackId?"":`<label>追加する曲<select id="chooseTrack">${eligible.map(s=>`<option value="${s.id}">${escapeHtml(s.title)} — ${escapeHtml(s.artist||"")}</option>`).join("")}</select></label>`}<div id="chooseMsg" class="notice hidden"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="secondary" id="cancelChoose">キャンセル</button><button id="doChoose">追加</button></div></form>`);$("cancelChoose").onclick=closeModal;$("chooseForm").onsubmit=async e=>{e.preventDefault();$("doChoose").disabled=true;try{const pid=$("choosePl").value,tid=trackId||$("chooseTrack").value;const existing=playlistItems.find(i=>i.playlist_id===pid&&i.track_id===tid);if(existing)throw new Error("この曲はすでにプレイリストにあります。");const position=Math.max(-1,...playlistItems.filter(i=>i.playlist_id===pid).map(i=>i.position))+1;const r=await db.from("music_playlist_tracks").insert({playlist_id:pid,track_id:tid,position});if(r.error)throw r.error;await loadAll();closeModal();activePlaylist=pid;activeView="playlistDetail";render();msg("プレイリストに曲を追加しました。")}catch(err){const n=$("chooseMsg");n.textContent=err.message;n.classList.remove("hidden");n.classList.add("error")}finally{$("doChoose").disabled=false}}}
async function removeFromPlaylist(itemId){const i=playlistItems.find(x=>x.id===itemId);if(!i)return;try{const r=await db.from("music_playlist_tracks").delete().eq("id",itemId);if(r.error)throw r.error;await loadAll();render();msg("プレイリストから曲を削除しました。")}catch(e){msg("削除エラー: "+e.message,true)}}
async function moveTrack(itemId,delta){const item=playlistItems.find(i=>i.id===itemId);if(!item)return;const arr=playlistItems.filter(i=>i.playlist_id===item.playlist_id).sort((a,b)=>a.position-b.position),idx=arr.findIndex(i=>i.id===itemId),j=idx+delta;if(j<0||j>=arr.length)return;const a=arr[idx],b=arr[j];try{let r=await db.from("music_playlist_tracks").update({position:-100000}).eq("id",a.id);if(r.error)throw r.error;r=await db.from("music_playlist_tracks").update({position:a.position}).eq("id",b.id);if(r.error)throw r.error;r=await db.from("music_playlist_tracks").update({position:b.position}).eq("id",a.id);if(r.error)throw r.error;await loadAll();render()}catch(e){msg("並べ替えエラー: "+e.message,true)}}
async function startSong(id,list){const s=songs.find(x=>x.id===id);if(!s)return;queue=(list&&list.length?list:visibleSongs()).filter(x=>x.audio_url);queueIndex=queue.findIndex(x=>x.id===id);if(queueIndex<0){queue=[s];queueIndex=0}await playAt(queueIndex)}
async function decodePngUrlToAudio(url){const response=await fetch(url);if(!response.ok)throw new Error("音声PNGの取得に失敗しました (HTTP "+response.status+")。");const pngBlob=await response.blob();const bitmap=await createImageBitmap(pngBlob);try{const canvas=document.createElement("canvas");canvas.width=bitmap.width;canvas.height=bitmap.height;const ctx=canvas.getContext("2d",{willReadFrequently:true});ctx.drawImage(bitmap,0,0);const rgba=ctx.getImageData(0,0,canvas.width,canvas.height).data;const raw=new Uint8Array(canvas.width*canvas.height*3);for(let i=0,j=0;i<rgba.length;i+=4){raw[j++]=rgba[i];raw[j++]=rgba[i+1];raw[j++]=rgba[i+2]}if(raw.length<8||raw[0]!==65||raw[1]!==50||raw[2]!==80||raw[3]!==49)throw new Error("これはGreenWave対応の音声PNGではありません。");const metaLen=new DataView(raw.buffer).getUint32(4,false);if(metaLen<2||metaLen>1048576||8+metaLen>raw.length)throw new Error("PNGの情報が壊れています。");const meta=JSON.parse(new TextDecoder("utf-8",{fatal:true}).decode(raw.subarray(8,8+metaLen)));const start=8+metaLen;if(!Number.isSafeInteger(meta.size)||meta.size<0||start+meta.size>raw.length)throw new Error("音声データの長さが正しくありません。");return new Blob([raw.slice(start,start+meta.size)],{type:typeof meta.type==="string"?meta.type:"application/octet-stream"})}finally{bitmap.close()}}
async function playAt(index){if(index<0||index>=queue.length)return;const s=queue[index];try{if(playerObjectUrl){URL.revokeObjectURL(playerObjectUrl);playerObjectUrl=null}queueIndex=index;currentSong=s;$("nowTitle").textContent=s.title;$("nowArtist").textContent=s.artist||"アーティスト不明";$("nowCover").src=safeCover(s.cover_url);$("nowCover").onerror=()=>{$("nowCover").src=DEFAULT_COVER};$("playBtn").textContent="…";audio.pause();msg("音声PNGを読み込んでいます…");const blob=await decodePngUrlToAudio(s.audio_url);playerObjectUrl=URL.createObjectURL(blob);audio.src=playerObjectUrl;audio.load();await audio.play();clearMsg()}catch(e){$("playBtn").textContent="▶";msg("再生できませんでした: "+(e.message||"エラー")+"。ImgBB画像のCORS制限で読み込めない場合は、CORS対応の画像保存先が必要です。",true)}}
function stopPlayer(){audio.pause();audio.removeAttribute("src");audio.load();currentSong=null;$("nowTitle").textContent="曲を選択してください";$("nowArtist").textContent="—";$("nowCover").src=DEFAULT_COVER;$("playBtn").textContent="▶"}
function next(){if(!queue.length)return;let n;if(shuffle&&queue.length>1){do{n=Math.floor(Math.random()*queue.length)}while(n===queueIndex)}else n=queueIndex+1;if(n>=queue.length){if(repeat)n=0;else return}playAt(n)}
function prev(){if(audio.currentTime>3){audio.currentTime=0;return}if(queueIndex>0)playAt(queueIndex-1);else if(repeat&&queue.length)playAt(queue.length-1)}
audio.addEventListener("play",()=>$("playBtn").textContent="Ⅱ");audio.addEventListener("pause",()=>$("playBtn").textContent="▶");audio.addEventListener("ended",()=>{if(repeat&&queue.length)playAt(queueIndex);else next()});audio.addEventListener("timeupdate",()=>{$("currentTime").textContent=fmt(audio.currentTime);$("duration").textContent=fmt(audio.duration);if(Number.isFinite(audio.duration)&&audio.duration>0)$("seek").value=String(Math.round(audio.currentTime/audio.duration*1000))});audio.addEventListener("loadedmetadata",()=>{$("duration").textContent=fmt(audio.duration)});$("playBtn").onclick=()=>{if(!currentSong){const s=visibleSongs()[0];if(s)startSong(s.id,visibleSongs());return}if(audio.paused)audio.play().catch(e=>msg("再生エラー: "+e.message,true));else audio.pause()};$("nextBtn").onclick=next;$("prevBtn").onclick=prev;$("shuffleBtn").onclick=()=>{shuffle=!shuffle;$("shuffleBtn").style.color=shuffle?"#1ed760":""};$("repeatBtn").onclick=()=>{repeat=!repeat;$("repeatBtn").style.color=repeat?"#1ed760":""};$("seek").oninput=()=>{if(Number.isFinite(audio.duration))audio.currentTime=Number($("seek").value)/1000*audio.duration};$("volume").oninput=()=>(audio.volume=Number($("volume").value));audio.volume=.8;
async function uploadImgBB(blob,name){if(!imgKey)throw new Error("ImgBB APIキーが設定されていません。いったんログアウトして入力してください。");const fd=new FormData();fd.append("image",blob,name);const res=await fetch("https://api.imgbb.com/1/upload?key="+encodeURIComponent(imgKey),{method:"POST",body:fd});let json;try{json=await res.json()}catch{throw new Error("ImgBBから応答を読み取れません。")}if(!res.ok||!json.success)throw new Error(json.error?.message||"ImgBBへのアップロードに失敗しました。");return json.data.url}
async function encodeAudioToPng(file){if(file.size>MAX_AUDIO_SIZE)throw new Error("音声ファイルは15MB以下にしてください。選択したファイル："+(file.size/1024/1024).toFixed(1)+"MB");const allowedAudio=/^(audio\/(wav|x-wav|wave|vnd\.wave|mpeg|mp3|ogg|webm|mp4|x-m4a|aac|flac|opus|aiff|x-aiff))$/i;const ext=(file.name.split(".").pop()||"").toLowerCase();if(!file.type.startsWith("audio/")&&!["wav","mp3","ogg","m4a","flac","aac","opus","webm","wma","aiff"].includes(ext))throw new Error("音声ファイル（WAV、MP3、OGG、M4A、FLAC、AAC、OPUS、WEBMなど）を選んでください。");const bytes=new Uint8Array(await file.arrayBuffer());if(bytes.length===0)throw new Error("音声ファイルが空です。");const meta=new TextEncoder().encode(JSON.stringify({name:file.name,type:file.type||"application/octet-stream",size:bytes.length}));const raw=new Uint8Array(8+meta.length+bytes.length);raw.set([65,50,80,49],0);new DataView(raw.buffer).setUint32(4,meta.length,false);raw.set(meta,8);raw.set(bytes,8+meta.length);const pixels=Math.ceil(raw.length/3),width=Math.min(1024,pixels),height=Math.ceil(pixels/width);if(height>32767)throw new Error("ファイルが大きすぎます。短い音声ファイルを使用してください。");const canvas=document.createElement("canvas");canvas.width=width;canvas.height=height;const ctx=canvas.getContext("2d",{willReadFrequently:true});const image=ctx.createImageData(width,height);for(let i=0;i<pixels;i++){const p=i*4,r=i*3;image.data[p]=raw[r]||0;image.data[p+1]=raw[r+1]||0;image.data[p+2]=raw[r+2]||0;image.data[p+3]=255}ctx.putImageData(image,0,0);return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error("PNGを作成できませんでした")),"image/png"))}
$("loginBtn").onclick=login;$("loginPass").addEventListener("keydown",e=>{if(e.key==="Enter")login()});$("logoutBtn").onclick=()=>{audio.pause();if(playerObjectUrl)URL.revokeObjectURL(playerObjectUrl);currentUser=null;db=null;songs=[];playlists=[];playlistItems=[];$("appView").classList.add("hidden");$("playerBar").classList.add("hidden");$("loginView").classList.remove("hidden");$("loginPass").value="";$("loginMsg").classList.add("hidden")};$("addSongBtn").onclick=()=>openSongModal();$("newPlaylistBtn").onclick=()=>openPlaylistModal();$("search").addEventListener("input",render);document.querySelectorAll(".sidebar [data-view]").forEach(b=>b.addEventListener("click",()=>{activeView=b.dataset.view;activePlaylist=null;document.querySelectorAll(".sidebar [data-view]").forEach(x=>x.classList.toggle("active",x===b));render()}));
</script>
